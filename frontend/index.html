<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMarket - Магазин продуктов</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="header__logo">
                FoodMarket
            </a>
            <nav class="header__nav" id="authNav">
                <!-- Сюда JS подставляет кнопки входа/регистрации или профиль -->
            </nav>
        </div>
    </header>

    <main class="main container">
        <div class="layout">

            <!-- Боковое меню с категориями -->
            <aside class="sidebar">
                <div class="sidebar__section">
                    <h2 class="sidebar__title">Категории</h2>
                    <ul class="sidebar__list" id="categoryList">
                        <!-- Категории подгружаются через JS -->
                    </ul>
                </div>

                <div class="sidebar__section">
                    <h2 class="sidebar__title">Сортировка</h2>
                    <div class="sidebar__sort">
                        <label for="sortBy">Поле:</label>
                        <select id="sortBy">
                            <option value="name">Названию</option>
                            <option value="price">Цене</option>
                        </select>
                        <label for="sortOrder">Порядок:</label>
                        <select id="sortOrder">
                            <option value="asc">По возрастанию</option>
                            <option value="desc">По убыванию</option>
                        </select>
                    </div>
                </div>

                <!-- Панель администратора (показывается только админу) -->
                <div class="sidebar__section sidebar__section--admin" id="adminPanel" style="display: none;">
                    <h2 class="sidebar__title">Администрирование</h2>
                    <button class="btn btn--admin" id="btnAddProduct">+ Добавить товар</button>
                    <button class="btn btn--admin" id="btnSeedData" style="margin-top: 8px;">Заполнить тестовыми данными</button>
                </div>
            </aside>

            <!-- Основной контент -->
            <section class="content">
                <!-- Уведомления и сообщения -->
                <div id="notifications"></div>

                <!-- Модальные окна -->
                <div class="modal-overlay" id="modalOverlay" style="display: none;">
                    <div class="modal" id="modalContent">
                        <!-- Контент подставляется через JS -->
                    </div>
                </div>

                <!-- Секция корзины (показана, если пользователь авторизован) -->
                <div class="cart-section" id="cartSection" style="display: none;">
                    <h2 class="content__title">Моя корзина</h2>
                    <div id="cartContent">
                        <p style="color: var(--color-text-light); font-size: 0.9rem;">Корзина пуста</p>
                    </div>
                    <button class="btn btn--primary" id="btnCheckout" style="display: none;">Оплатить</button>
                </div>

                <!-- Панель фильтров: поиск + цена -->
                <div class="filter-bar">
                    <input type="text" id="searchInput" placeholder="Поиск товара..." class="filter-bar__search">
                    <input type="number" id="priceMin" placeholder="Цена от" min="0" class="filter-bar__price">
                    <input type="number" id="priceMax" placeholder="Цена до" min="0" class="filter-bar__price">
                    <button class="btn btn--primary" id="applyFilters">Применить</button>
                </div>

                <!-- Сетка товаров -->
                <div class="products-header">
                    <h2 class="content__title" id="productsTitle">Товары</h2>
                    <span class="products-count" id="productsCount"></span>
                </div>

                <div class="products-grid" id="productsGrid">
                    <!-- Карточки товаров подгружаются через JS -->
                </div>

                <!-- Пагинация -->
                <div class="pagination" id="pagination">
                    <!-- Кнопки пагинации подгружаются через JS -->
                </div>
            </section>
        </div>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>FoodMarket &copy; 2025 — Учебный проект для изучения PHP, Symfony и веб-технологий</p>
        </div>
    </footer>

    <!-- Подключаем JS модули (каждый файл отвечает за свою часть) -->
    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/cart.js?v=5"></script>
    <script src="js/admin.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
</body>
</html>
