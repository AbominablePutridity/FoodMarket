# FoodMarket - конфигурация Swagger UI (NelmioApiDoc)
nelmio_api_doc:
    documentation:
        info:
            title: 'FoodMarket API'
            description: 'API для магазина продуктов. Позволяет управлять товарами, категориями, корзиной и заказами.'
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api/(?!doc)
