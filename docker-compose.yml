# FoodMarket - Docker Compose
# Поднимает три сервиса: PostgreSQL, PHP-FPM (Symfony) и Nginx
#
# Запуск: docker-compose up -d --build
# Остановка: docker-compose down

version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: foodmarket-postgres
    environment:
      POSTGRES_DB: foodmarket
      POSTGRES_USER: foodmarket
      POSTGRES_PASSWORD: foodmarket_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodmarket-network

  # PHP-FPM с Symfony
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodmarket-php
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://foodmarket:foodmarket_pass@postgres:5432/foodmarket?serverVersion=15&charset=utf8
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/migrations:/app/migrations
      - ./backend/templates:/app/templates
      - ./backend/public:/app/public
      - ./backend/bin:/app/bin
      - ./backend/data:/app/data
      - ./backend/composer.json:/app/composer.json
      - ./backend/.env:/app/.env
      - vendor_data:/app/vendor
      - var_data:/app/var
    depends_on:
      - postgres
    networks:
      - foodmarket-network

  # Nginx веб-сервер
  nginx:
    image: nginx:alpine
    container_name: foodmarket-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/frontend
      - ./backend/public:/app/public
    depends_on:
      - php
    networks:
      - foodmarket-network

volumes:
  postgres_data:
  vendor_data:
  var_data:

networks:
  foodmarket-network:
    driver: bridge
