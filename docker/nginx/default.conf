# FoodMarket - конфигурация Nginx
# Раздаёт статику фронтенда и проксирует API на PHP-FPM

server {
    listen 80;
    server_name localhost;

    # Размер загружаемых файлов
    client_max_body_size 20M;

    # ==========================================
    # Frontend — статические файлы (HTML/CSS/JS)
    # ==========================================
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ==========================================
    # API — перенаправляем на Symfony (index.php)
    # ==========================================
    location /api/ {
        # Все запросы к /api/* идут на index.php
        rewrite ^/api(/.*)$ /index.php$1 last;
    }

    # Загруженные файлы (изображения товаров)
    location /uploads/ {
        root /app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Статические файлы Symfony (например, /bundles/)
    location /bundles/ {
        root /app/public;
    }

    # ==========================================
    # PHP — FastCGI передача на PHP-FPM
    # ==========================================
    location ~ ^/index\.php(/|$) {
        root /app/public;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Читаем буфер для Swagger UI
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Параметры для Symfony
        fastcgi_param APP_ENV dev;
        fastcgi_param APP_DEBUG true;

        internal;
    }

    # Запрещаем доступ к другим PHP файлам
    location ~ \.php$ {
        return 404;
    }

    # Скрываем системные файлы
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
